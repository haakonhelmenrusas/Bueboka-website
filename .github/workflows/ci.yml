name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Cancel superseded runs on the same ref, so a rapid series of pushes to a PR
# only pays for the newest one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # These are throwaway placeholders, not credentials. Nothing here connects
    # to a database: `prisma generate` only needs a syntactically valid URL to
    # satisfy prisma.config.ts, and `next build` needs a secret present so
    # better-auth does not throw while prerendering. Never point these at a
    # real environment - if this job ever needs real values, they belong in
    # repository secrets instead.
    env:
      DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-for-anything
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Must run before typecheck and build: lib/prisma.ts imports the
      # generated client, which is gitignored, so both fail without it.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --ci

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Fails on high and critical advisories. This job can go red without any
      # code change, when a new advisory is published against an existing
      # dependency - that is the point, but it also means a red audit does not
      # necessarily implicate the PR it appears on. Lower the threshold with
      # --audit-level=critical, or drop `npm audit` for `npm audit --omit=dev`
      # to ignore build-time-only packages, if this proves too noisy.
      - name: Audit dependencies
        run: npm audit --audit-level=high
